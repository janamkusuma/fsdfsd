<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="Viewport" content="width=device-width,initial-scale+1.0">
        <title> Event Capturing </title>
        <style>
            /*General body styling*/
            body{
                font-family: 'Arial',sans-serif;/*Modern sans-serif font*/
                background-color: #f4f4f9;/*light background color for contrast*/
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
                flex-direction: column;/*Align content vertically*/
            }
            body{
                background-color: #f0f0fa;
            }
            .watermark{
                position: fixed;
                bottom: 20px;
                right: 20px;
                font-size: 14px;
                color: blue;
                z-index: 0;
                pointer-events: none;
            }

            /*styling for the heading*/
            h2{
                font-size: 18px;
                color: #2c3e50;
                font-weight: bold;
                margin-bottom: 20px;/*space between heading and content*/
            }
            /*styling for the parent container*/
            #parent{
                padding: 30px;
                border-radius: 10px;
                background-color: #ffffff;
                box-shadow: 0 4px 10px rgba(0,0,0,0.1);/*soft shadow for depth*/
                display: flex;
                justify-content: center;
                align-items: center;
                width: 300px;
                height: 200px;
                cursor: pointer;
                transition: all 0.3s ease-in-out;
            }
            #parent:hover{
                background-color: #e8f0fe;/*light blue hover effect*/
                transform: scale(1.05);/*slight zoom on hover*/
            }
            /*styling for the child container*/
            #child{
                padding: 15px;
                background-color: #2ecc71;/*green background*/
                color: #ffffff;/*white text*/
                border-radius: 5px;
                font-size: 16px;
                font-weight: bold;
                cursor: pointer;
                transition: all 0.2s ease;
            }
            #child:hover{
                background-color: #27ae60;/*darker green on hover*/
                transform: scale(1.1);/*slight zoom effect on hover*/
            }
            /*text styling for feedback*/
            p{
                font-size: 18px;
                font-weight: 600;
                color: #2c3e50;
                margin: 0;
            }
        </style>
    </head>
    <body>
        <h2> Event Capturing </h2>
        <div id="parent">
            <div id="child">Click Me!</div>
        </div>
        <script>
            document.getElementById('parent').addEventListener('click',function(){
                alert('Parent Div Clicked (Capturing)');
            }, true);
            document.getElementById('child').addEventListener('click',function(){
                alert('Child Div Clicked (Capturing)');
            }, true);
        </script>
        <div class="watermark">J.KUSUMA 22BQ1A4264</div>
    </body>
</html>
